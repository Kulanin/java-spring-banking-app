# Database URL (pointing to your MySQL server and the 'users' database)
spring.datasource.url=jdbc:mysql://localhost:3306/demo_bank_app?useSSL=false&serverTimezone=UTC

# Your MySQL credentials
spring.datasource.username=root
spring.datasource.password=Lulama01

# The driver for MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings (Crucial for auto-creating tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect